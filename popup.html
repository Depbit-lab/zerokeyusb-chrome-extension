<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; width: 240px; margin: 0; padding: 12px; }
    h1 { font-size: 13px; margin: 0 0 8px; }
    #status { margin: 6px 0; color: #333; }
    #status.ok { color: #128a3a; }
    #status.warn { color: #b26a00; }
    #status.err { color: #c0392b; }
    button { width: 100%; padding: 8px; margin-top: 8px; cursor: pointer;
             border: 1px solid #999; border-radius: 6px; background: #f5f5f5; }
    button:hover { background: #ececec; }
    .hint { color: #777; font-size: 11px; margin-top: 8px; }
    code { background: #eee; padding: 0 3px; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>ZeroKeyUSB Web Link</h1>
  <div id="status">Looking for device…</div>
  <button id="connect" style="display:none">Connect ZeroKeyUSB…</button>
  <div class="hint" id="hint"></div>
  <script src="popup.js"></script>
</body>
</html>
