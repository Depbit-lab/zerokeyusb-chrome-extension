<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Link ZeroKeyUSB</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 20px; }
    button { font-size: 15px; padding: 10px 16px; cursor: pointer;
             border: 1px solid #888; border-radius: 8px; background: #f5f5f5; }
    button:hover { background: #ececec; }
    #status { margin-top: 16px; }
    #status.ok { color: #128a3a; font-weight: 600; }
    #status.warn { color: #b26a00; }
    #status.err { color: #c0392b; }
    ol { color: #444; }
    code { background: #eee; padding: 0 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>Link your ZeroKeyUSB</h1>
  <p>Grant this extension access to the ZeroKeyUSB serial port. You only need to
     do this once — it is remembered afterwards.</p>
  <ol>
    <li>Make sure the device is plugged in and running the updated firmware.</li>
    <li>Click the button below and pick the <b>ZeroKeyUSB</b> port in the chooser.</li>
  </ol>
  <button id="connect">Choose ZeroKeyUSB port…</button>
  <div id="status"></div>
  <script src="connect.js"></script>
</body>
</html>
